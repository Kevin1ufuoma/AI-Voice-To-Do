<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AI Voice To-Do List App</title>
        <!-- Link to standard external CSS stylesheet -->
        <link rel="stylesheet" href="style.css">
        <link rel="manifest" href="manifest.json">
    </head>
    <body class="dark-theme">
        
        <!-- Main App Container -->
        <div class="app-container">
                <header class="app-header">
                    <div class="header-main">
                        <h1>AI Voice To-Do List</h1>
                        <!-- Theme toggle control switch -->
                        <button id="theme-toggle" type="button" aria-label="Toggle Theme">🌙 Dark Mode</button>
                    </div>
                    <span id="ai-status" class="status-badge">AI Ready</span>
                </header>

            <!-- User Profile Onboarding Section -->
            <div id="profile-container" class="profile-card">
                <h2>Welcome! What should the AI call you?</h2>
                <div class="profile-form">
                    <input type="text" id="user-name-input" placeholder="Enter your name...">
                    <button type="button" id="save-profile-btn">Save Name</button>
                </div>
            </div>

            <!-- Voice Control Panel -->
            <div class="voice-panel">
                <div class="voice-info">
                    <h2>Voice Assistant</h2>
                    <p id="voice-instruction">Click the mic to speak your tasks.</p>
                </div>
                <button id="mic-btn" type="button" aria-label="Microphone Button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
            </div>

            <!-- Manual Input Form -->
            <form id="todo-form">
                <div class="input-group">
                    <!-- User fills task information first -->
                    <input type="text" id="todo-text" placeholder="What do you need to do?" required>
                    
                    <!-- Date wrapper container that will be handled by CSS/JS to only reveal when text is present -->
                    <div id="date-picker-container" style="display: none;">
                        <label for="todo-date">Select Event Date:</label>
                        <input type="date" id="todo-date">
                    </div>
                </div>
                
                <!-- Task Submission Button located directly underneath inputs -->
                <button type="submit" id="add-btn">Add To-Do Task</button>
            </form>

            <!-- Dynamic Task List -->
            <ul id="todo-list">
                <!-- Dynamic list items (<li>) generated by JavaScript will follow this structural layout:
                <li>
                    <div class="task-details">
                        <span class="task-title">Task text goes here</span>
                        <span class="task-date">Date: YYYY-MM-DD</span>
                    </div>
                    <div class="task-actions">
                        <button class="edit-btn">Edit</button>
                        <button class="delete-btn">Delete</button>
                    </div>
                </li>
                -->
            </ul>
        </div>

        <!-- External JavaScript Application logic -->
        <script src="script.js"></script>
    </body>
</html>
